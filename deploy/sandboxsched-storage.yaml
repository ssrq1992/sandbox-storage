# SandboxSched standalone NFS storage deployment.
#
# This manifest deploys the SandboxSched NFS storage stack independently of
# any other runtime scenario:
#   - DaemonSet sandboxsched-storage-node: one pod per storage node running
#     the SandboxSched node storage adapter (single container).
#   - Deployment ssf-coordinator: the control-plane coordinator hosting the
#     "sandboxsched" runtime plugin.
#
# Storage scope: NFS only. Every requested PVC must resolve to an NFS export
# (in-tree nfs or nfs.csi.k8s.io CSI source); anything else is rejected at
# bind time. There is no storage engine, no CSI driver and no block volume
# support in this stack.
#
# Required separately installed dependencies (not included here):
#   - Secrets copied into this namespace before applying:
#       sandboxsched-node-tls        (tls.crt/tls.key/ca.crt, SAN: the storage
#                                    node service name; the adapter both serves
#                                    and authenticates with this identity)
#       sandboxsched-coordinator-tls (coordinator server identity)
#       sandboxsched-auth            (api-key)
#       sandboxsched-ledger          (url: PostgreSQL connection string)
#   - An NFS provisioner (e.g. nfs-subdir-external-provisioner) serving the
#     namespaces listed in the control plugin principal.
#
# TLS note: the coordinator client verifies the coordinator certificate
# against the DNS SAN of the issuing deployment. When reusing certificates
# minted for another namespace, set coordinator.server_name in
# sandboxsched-node.json to a SAN entry of the coordinator certificate.
#
# State note: the adapter keeps its bbolt journal at <Root>/journal and
# mounts NFS exports under <Root>/mounts. Root lives inside the host
# /var/lib/ssf directory: the sandbox agent pods bind-mount published
# exports from that same host path, so it is mounted with Bidirectional
# propagation and must stay identical inside and outside the container.
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxsched-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxsched-storage-node
  namespace: sandboxsched-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssf-coordinator
  namespace: sandboxsched-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandboxsched-storage
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes", "nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandboxsched-storage-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandboxsched-storage
subjects:
  - kind: ServiceAccount
    name: sandboxsched-storage-node
    namespace: sandboxsched-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandboxsched-ssf-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandboxsched-storage
subjects:
  - kind: ServiceAccount
    name: ssf-coordinator
    namespace: sandboxsched-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandboxsched-ssf-config
  namespace: sandboxsched-storage
data:
  coordinator.json: |-
    {
      "listen": ":9446",
      "health_listen": ":9096",
      "tls": {
        "endpoint": "",
        "cert": "/etc/sandboxsched-tls/tls.crt",
        "key": "/etc/sandboxsched-tls/tls.key",
        "ca": "/etc/sandboxsched-tls/ca.crt",
        "peer": ""
      },
      "node_peers": [
        "spiffe://ssf/agentenv/node"
      ],
      "sandboxsched_runtime_config": "/etc/sandboxsched-ssf/sandboxsched-control.json"
    }
  sandboxsched-control.json: |-
    {
      "principal": {
        "tenant": "sandboxsched",
        "namespaces": [
          "flux-sandbox-test"
        ]
      }
    }
  sandboxsched-node.json: |-
    {
      "listen": ":9447",
      "health_listen": ":9095",
      "cert": "/etc/sandboxsched-tls/tls.crt",
      "key": "/etc/sandboxsched-tls/tls.key",
      "ca": "/etc/sandboxsched-tls/ca.crt",
      "coordinator": {
        "endpoint": "https://ssf-coordinator.sandboxsched-storage.svc:9446",
        "cert": "/etc/sandboxsched-tls/tls.crt",
        "key": "/etc/sandboxsched-tls/tls.key",
        "ca": "/etc/sandboxsched-tls/ca.crt",
        "peer": "spiffe://ssf/agentenv/coordinator",
        "server_name": "ssf-coordinator.agentenv-system.svc"
      },
      "runtime": "sandboxsched",
      "api_key_file": "/etc/sandboxsched-auth/api-key",
      "root": "/var/lib/ssf/sandboxschedadapter"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandboxsched-storage-node
  namespace: sandboxsched-storage
  labels:
    app.kubernetes.io/name: sandboxsched-storage-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxsched-storage-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxsched-storage-node
    spec:
      serviceAccountName: sandboxsched-storage-node
      nodeSelector:
        kubernetes.io/os: linux
        ssf.dev/storage-test: "true"
      terminationGracePeriodSeconds: 120
      containers:
        - name: sandboxsched-storage
          image: localhost:5001/ssf-v10/sandboxschedadapter:v10-20261109b
          imagePullPolicy: Always
          command: ["sandboxschedadapter"]
          args: ["node", "-config", "/etc/sandboxsched-ssf/sandboxsched-node.json"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9447
              name: node-api
            - containerPort: 9095
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: health
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /host/proc
              name: host-proc
              readOnly: true
            - mountPath: /etc/sandboxsched-ssf
              name: config
              readOnly: true
            - mountPath: /etc/sandboxsched-tls
              name: node-tls
              readOnly: true
            - mountPath: /etc/sandboxsched-auth
              name: auth
              readOnly: true
            # /var/lib/ssf must stay identical inside and outside this
            # container: the journal lives under <root>/journal and published
            # NFS exports under <root>/mounts are bind-mounted into sandboxes
            # by the agent pods from the same host path.
            - mountPath: /var/lib/ssf
              mountPropagation: Bidirectional
              name: ssf-state
      volumes:
        - name: config
          configMap:
            name: sandboxsched-ssf-config
        - name: node-tls
          secret:
            secretName: sandboxsched-node-tls
        - name: auth
          secret:
            secretName: sandboxsched-auth
        - name: ssf-state
          hostPath:
            path: /var/lib/ssf
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sandboxsched-storage-node
  namespace: sandboxsched-storage
  labels:
    app.kubernetes.io/name: sandboxsched-storage-node
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandboxsched-storage-node
  ports:
    - name: node-api
      port: 9447
      targetPort: node-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssf-coordinator
  namespace: sandboxsched-storage
  labels:
    app.kubernetes.io/name: ssf-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssf-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssf-coordinator
    spec:
      serviceAccountName: ssf-coordinator
      terminationGracePeriodSeconds: 60
      containers:
        - name: coordinator
          image: localhost:5001/ssf-v10/ssf:v10-20261109b
          imagePullPolicy: Always
          command: ["ssf-coordinator"]
          args: ["-config", "/etc/sandboxsched-ssf/coordinator.json"]
          env:
            - name: SSF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: url
                  name: sandboxsched-ledger
          ports:
            - containerPort: 9446
              name: control
            - containerPort: 9096
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          volumeMounts:
            - mountPath: /etc/sandboxsched-ssf
              name: config
              readOnly: true
            - mountPath: /etc/sandboxsched-tls
              name: tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sandboxsched-ssf-config
        - name: tls
          secret:
            secretName: sandboxsched-coordinator-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ssf-coordinator
  namespace: sandboxsched-storage
  labels:
    app.kubernetes.io/name: ssf-coordinator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssf-coordinator
  ports:
    - name: control
      port: 9446
      targetPort: control
