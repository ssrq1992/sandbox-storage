        - --global-config
        - /etc/ssf-overlaybd/overlaybd.json
        - --resize-global-config
        - /etc/ssf-overlaybd/resize.json
        - --managed-state-dir
        - /var/lib/ssf/overlaybd/daemon
        - --metrics-listen-addr
        - 0.0.0.0:9106
        - --config
        - /etc/ssf-overlaybd/daemon.toml
        command:
        - uvm-ublk-daemon
        image: ssf-overlaybd:latest
        name: overlaybd-daemon
        restartPolicy: Always
        securityContext:
          privileged: true
          runAsUser: 0
        startupProbe:
          exec:
