          name: overlaybd-sockets
        - mountPath: /var/lib/ssf
          mountPropagation: Bidirectional
          name: ssf-state
        - mountPath: /dev
          name: host-dev
        - mountPath: /var/lib/ssf-overlaybd-repository
          name: overlaybd-repository
        - mountPath: /opt/aenv-deps/overlaybd
          name: overlaybd-tools
          readOnly: true
      - args:
        - /run/ssf-overlaybd-config/private/native.json
