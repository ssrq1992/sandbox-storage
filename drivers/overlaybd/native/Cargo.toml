[package]
name = "ssf-overlaybd-native"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
metadata = ["aenv-volume-core/metadata", "dep:uuid"]
volume-host = ["metadata", "aenv-volume-core/content"]
device-host = ["volume-host", "dep:uvm-ublk-daemon", "dep:tokio", "dep:tokio-stream", "dep:object-store-operator"]

[dependencies]
object-store-operator = { path = "../../../../AgentENV/crates/object-store-operator", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
uvm-ublk-daemon = { path = "../../../../AgentENV/storage/ublk-daemon", optional = true }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", optional = true }
aenv-volume-core = { path = "../../../../AgentENV/storage/volume-core" }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
serde_json = "1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[workspace]

[[bin]]
name = "ssf-overlaybd-native"
path = "src/main.rs"
required-features = ["device-host"]
