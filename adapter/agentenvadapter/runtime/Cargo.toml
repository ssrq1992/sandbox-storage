[package]
name = "agentenv-storage-plugin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8"
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
tracing = "0.1"
tempfile = "3"

[workspace]
