apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-scheduler
spec:
  template:
    spec:
      containers:
        - name: scheduler
          env:
            - name: AENV_SSF_CONFIG
              value: /etc/agentenv-ssf/scheduler.json
          ports:
            - name: storage-observe
              containerPort: 9447
          volumeMounts:
            - name: storage-config
              mountPath: /etc/agentenv-ssf
              readOnly: true
            - name: storage-control-tls
              mountPath: /etc/agentenv-storage-tls
              readOnly: true
      volumes:
        - name: storage-config
          configMap:
            name: agentenv-ssf-config
            items:
              - key: scheduler.json
                path: scheduler.json
        - name: storage-control-tls
          secret:
            secretName: agentenv-storage-control-tls
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: agentenv-scheduler
spec:
  ports:
    - name: storage-observe
      port: 9447
      targetPort: storage-observe
