apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssf-coordinator
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ssf-coordinator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ssf-coordinator}
    spec:
      serviceAccountName: ssf-coordinator
      terminationGracePeriodSeconds: 60
      containers:
        - name: coordinator
          image: ssf:latest
          command: [ssf-coordinator]
          args: [-config, /etc/agentenv-ssf/coordinator.json]
          ports:
            - {name: control, containerPort: 9446}
            - {name: health, containerPort: 9096}
          env:
            - name: SSF_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: agentenv-storage-ledger, key: url}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /livez, port: health}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/agentenv-ssf, readOnly: true}
            - {name: keys, mountPath: /etc/agentenv-storage, readOnly: true}
            - {name: tls, mountPath: /etc/agentenv-storage-tls, readOnly: true}
            - {name: auth, mountPath: /etc/agentenv-native-auth, readOnly: true}
      volumes:
        - name: config
          configMap: {name: agentenv-ssf-config}
        - name: keys
          secret: {secretName: agentenv-storage-control, defaultMode: 0444}
        - name: tls
          secret: {secretName: agentenv-storage-coordinator-tls, defaultMode: 0444}
        - name: auth
          secret: {secretName: agentenv-auth, defaultMode: 0444}
---
apiVersion: v1
kind: Service
metadata:
  name: ssf-coordinator
spec:
  selector: {app.kubernetes.io/name: ssf-coordinator}
  ports:
    - {name: control, port: 9446, targetPort: control}
