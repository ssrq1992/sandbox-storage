apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentenv-system
resources:
  - ../../../../../AgentENV/deploy/k8s/base
  - rbac.yaml
  - coordinator.yaml
patches:
  - path: gateway.yaml
  - path: scheduler.yaml
  - path: node.yaml
configMapGenerator:
  - name: agentenv-ssf-config
    files:
      - control.json=config/control.json
      - coordinator.json=config/coordinator.json
      - scheduler.json=config/scheduler.json
      - node.json=config/node.json
      - ssf-node.json=config/ssf-node.json
  - name: gateway-k8s-config
    behavior: merge
    files:
      - gateway.json=config/gateway.json
generatorOptions:
  disableNameSuffixHash: true
